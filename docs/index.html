<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PrepVault — Interview Q&A</title>
<meta name="description" content="Store, organise and share your interview questions and answers.">

<!-- Fix 5: SVG favicon (book emoji rendered as SVG) -->
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234A72E8'/><text y='.9em' font-size='68' x='12' fill='white'>📝</text></svg>">

<!-- Fonts — Fix 7: Cascadia Code for code blocks -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;1,400&family=Cascadia+Code&display=swap" rel="stylesheet">

<!-- App CSS -->
<link rel="stylesheet" href="style.css">

<!-- Libraries -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
</head>
<body>

<!-- TOAST -->
<div id="toast-root"></div>

<!-- ── AUTH ─────────────────────────────────────────────── -->
<div id="auth-screen" class="hidden">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="auth-logo-mark">P</div>
      <div class="auth-logo-text">Prep<span>Vault</span></div>
    </div>
    <div>
      <div class="auth-heading" id="auth-heading">Welcome back</div>
      <div class="auth-sub" style="margin-top:6px" id="auth-sub">Sign in to access your interview questions.</div>
    </div>
    <div class="flex flex-col gap-2">
      <div class="field" id="name-field" style="display:none">
        <label>Your name</label>
        <input class="input" id="auth-name" type="text" placeholder="Jane Smith" autocomplete="name">
      </div>
      <div class="field">
        <label>Email</label>
        <input class="input" id="auth-email" type="email" placeholder="you@example.com" autocomplete="email">
      </div>
      <div class="field">
        <label>Password</label>
        <input class="input" id="auth-password" type="password" placeholder="••••••••" autocomplete="current-password">
      </div>
      <div class="field" id="confirm-field" style="display:none">
        <label>Confirm password</label>
        <input class="input" id="auth-confirm" type="password" placeholder="••••••••" autocomplete="new-password">
      </div>
    </div>
    <button class="btn btn-primary" style="width:100%;justify-content:center" id="auth-submit">Sign in</button>
    <div class="auth-sep">or</div>
    <button class="btn btn-ghost" style="width:100%;justify-content:center" id="auth-google">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#4285F4" d="M44.5 20H24v8.5h11.8C34.7 33.9 30.1 37 24 37c-7.2 0-13-5.8-13-13s5.8-13 13-13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3 12.9 3 4 11.9 4 23s8.9 20 20 20c11 0 20-8 20-20 0-1.3-.2-2.7-.5-4z"/><path fill="#34A853" d="M6.3 14.7l7 5.1C15.1 16.2 19.2 13 24 13c3.1 0 5.9 1.1 8.1 2.9l6.4-6.4C34.6 5.1 29.6 3 24 3c-7.5 0-14 4.1-17.7 10.3z" opacity=".7"/><path fill="#FBBC05" d="M24 43c5.4 0 10.1-1.8 13.8-4.9l-6.4-5.3C29.4 34.6 26.8 35.5 24 35.5c-6 0-11.1-4-13-9.5l-7 5.4C7.5 38.8 15.2 43 24 43z" opacity=".7"/><path fill="#EA4335" d="M44.5 20H24v8.5h11.8c-.9 2.6-2.6 4.8-4.8 6.3l6.4 5.3C41.2 36.7 44.5 30.3 44.5 23c0-1-.1-2-.5-3z" opacity=".7"/></svg>
      Continue with Google
    </button>
    <div class="auth-switch" id="auth-switch">
      Don't have an account? <a href="#" id="auth-toggle">Create one</a>
    </div>
  </div>
</div>

<!-- ── APP ──────────────────────────────────────────────── -->
<div id="app" class="hidden">
  <div id="sidebar-overlay"></div>

  <nav id="sidebar">
    <div class="sidebar-header">
      <div class="logo">
        <div class="logo-mark">P</div>
        <span>PrepVault</span>
      </div>
      <!-- Fix 8: close button always rendered, shown via CSS on mobile -->
      <button class="btn-icon" id="close-sidebar" title="Close menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="sidebar-search">
      <div class="search-icon">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      </div>
      <input type="search" id="search-input" placeholder="Search questions…" autocomplete="off">
    </div>
    <div class="sidebar-topics" id="sidebar-topics">
      <div class="sidebar-section-label">My Topics</div>
      <div id="topics-list">
        <div class="loading-center" style="padding:24px"><div class="spinner"></div></div>
      </div>
      <button class="btn btn-ghost btn-sm" style="width:100%;justify-content:center;margin-top:8px" id="new-topic-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        New Topic
      </button>
    </div>
    <div class="sidebar-footer">
      <div class="user-avatar" id="user-avatar">?</div>
      <div class="user-email truncate" id="user-email"></div>
      <div class="flex gap-1">
        <button class="btn-icon" id="theme-toggle" title="Toggle theme">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>
        </button>
        <button class="btn-icon" id="signout-btn" title="Sign out">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        </button>
      </div>
    </div>
  </nav>

  <div id="main">
    <header id="header">
      <!-- Fix 8: hamburger always in DOM, shown via CSS on mobile -->
      <button class="btn-icon" id="open-sidebar" title="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
      </button>
      <div class="page-title" id="header-title">PrepVault</div>
      <div id="header-actions" class="flex gap-2 items-center"></div>
    </header>
    <main id="content"></main>
  </div>
</div>

<!-- ── TOPIC MODAL ───────────────────────────────────────── -->
<div id="topic-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-title" id="topic-modal-title">New Topic</div>
    <form class="topic-form" id="topic-form" onsubmit="return false">
      <div class="field">
        <label>Topic name</label>
        <input class="input" id="topic-name" type="text" placeholder="e.g. React, System Design, SQL…" required>
      </div>
      <div class="field">
        <label>Description <span style="color:var(--text-3);font-weight:400">(optional)</span></label>
        <textarea class="input" id="topic-desc" rows="2" placeholder="What is this topic about?"></textarea>
      </div>
      <div class="toggle-row">
        <div class="toggle-info">
          <div class="toggle-label">Make public</div>
          <div class="toggle-desc">Anyone with the link can read this topic.</div>
        </div>
        <label class="toggle">
          <input type="checkbox" id="topic-public">
          <div class="toggle-track"></div>
          <div class="toggle-thumb"></div>
        </label>
      </div>
      <!-- Fix 1: actions div that delete button prepends into -->
      <div class="flex gap-2 justify-between topic-form-actions" style="margin-top:4px">
        <button class="btn btn-ghost" type="button" id="topic-cancel">Cancel</button>
        <button class="btn btn-primary" type="submit" id="topic-save">Create Topic</button>
      </div>
    </form>
  </div>
</div>

<!-- ── EDITOR MODAL ──────────────────────────────────────── -->
<div id="editor-modal" class="modal-backdrop hidden">
  <div class="modal" style="padding:0">
    <div class="editor-header">
      <input class="editor-title-input" id="q-title-input" placeholder="Question text…" style="font-family:var(--serif)">
      <button class="btn-icon" id="editor-close" title="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="editor-toolbar">
      <button class="tb-btn" data-action="bold"><b>B</b></button>
      <button class="tb-btn" data-action="italic"><i>I</i></button>
      <button class="tb-btn" data-action="code">&#96;code&#96;</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" data-action="h2">H2</button>
      <button class="tb-btn" data-action="h3">H3</button>
      <button class="tb-btn" data-action="ul">• List</button>
      <button class="tb-btn" data-action="ol">1. List</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" data-action="link">Link</button>
      <button class="tb-btn" data-action="table">Table</button>
      <button class="tb-btn" data-action="codeblock">```block</button>
      <div class="tb-sep"></div>
      <button class="tb-btn" data-action="mermaid">📊 Mermaid</button>
    </div>
    <div class="editor-body">
      <div class="editor-pane">
        <div class="editor-pane-label">Markdown</div>
        <textarea class="editor-textarea" id="answer-editor" placeholder="Write your answer in Markdown…&#10;&#10;Try ```mermaid for flow diagrams!"></textarea>
      </div>
      <div class="editor-pane">
        <div class="editor-pane-label">Preview</div>
        <div class="editor-preview md-body" id="editor-preview"></div>
      </div>
    </div>
    <div class="editor-footer">
      <button class="btn btn-ghost" id="editor-cancel">Cancel</button>
      <button class="btn btn-primary" id="editor-save">Save Question</button>
    </div>
  </div>
</div>

<!-- ── CONFIRM MODAL ─────────────────────────────────────── -->
<div id="confirm-modal" class="modal-backdrop hidden">
  <div class="modal" style="max-width:380px">
    <div class="modal-title" id="confirm-title">Confirm</div>
    <p id="confirm-body" style="font-size:.9rem;color:var(--text-2)"></p>
    <div class="flex gap-2 justify-between">
      <button class="btn btn-ghost"  id="confirm-no">Cancel</button>
      <button class="btn btn-danger" id="confirm-yes">Delete</button>
    </div>
  </div>
</div>

<!-- ── SHARE MODAL ───────────────────────────────────────── -->
<div id="share-modal" class="modal-backdrop hidden">
  <div class="modal">
    <div class="modal-title">Share Topic</div>
    <p style="font-size:.875rem;color:var(--text-2)">Anyone with this link can read (not edit) your topic.</p>
    <div class="field">
      <label>Public link</label>
      <div class="flex gap-2">
        <input class="input" id="share-url" readonly style="font-size:.8rem">
        <button class="btn btn-ghost" id="copy-share-url">Copy</button>
      </div>
    </div>
    <button class="btn btn-ghost" id="share-close" style="align-self:flex-end">Done</button>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
