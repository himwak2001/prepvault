<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>PrepVault - Interview Q&A</title>
<meta name="description" content="Store, organise and share your interview questions and answers.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%234A72E8'/><text y='.9em' font-size='68' x='12' fill='white'>📝</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Lora:ital,wght@0,500;1,400&family=Cascadia+Code&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<style>
/* ─── DESIGN TOKENS ─────────────────────────────────────── */
:root {
  --bg:        #F7F8FA;
  --surface:   #FFFFFF;
  --surface2:  #EEF0F4;
  --border:    #E2E5EB;
  --text:      #1A1D23;
  --text-2:    #5C6070;
  --text-3:    #9AA0B0;
  --accent:    #4A72E8;
  --accent-h:  #3A5FD4;
  --accent-s:  #EBF0FD;
  --green:     #22A06B;
  --green-s:   #E3F7EF;
  --red:       #D94040;
  --red-s:     #FDECEC;
  --yellow:    #D4900A;
  --yellow-s:  #FEF5E0;
  --radius:    10px;
  --radius-lg: 16px;
  --shadow:    0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.05);
  --shadow-lg: 0 4px 24px rgba(0,0,0,.10);
  --font:      'Inter', system-ui, sans-serif;
  --serif:     'Lora', Georgia, serif;
  --mono:      'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace;
  --sidebar-w: 260px;
  --header-h:  58px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:       #12141A;
    --surface:  #1C1F28;
    --surface2: #242836;
    --border:   #2E3344;
    --text:     #E8EAF0;
    --text-2:   #9AA0B0;
    --text-3:   #5C6070;
    --accent:   #6B8FFF;
    --accent-h: #839FFF;
    --accent-s: #1A2240;
    --green:    #34C987;
    --green-s:  #0F2A1C;
    --red:      #F06060;
    --red-s:    #2A0F0F;
    --yellow:   #F0B830;
    --yellow-s: #2A1F05;
    --shadow:   0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
    --shadow-lg:0 4px 24px rgba(0,0,0,.4);
  }
}
:root[data-theme="dark"] {
  --bg:       #12141A;
  --surface:  #1C1F28;
  --surface2: #242836;
  --border:   #2E3344;
  --text:     #E8EAF0;
  --text-2:   #9AA0B0;
  --text-3:   #5C6070;
  --accent:   #6B8FFF;
  --accent-h: #839FFF;
  --accent-s: #1A2240;
  --green:    #34C987;
  --green-s:  #0F2A1C;
  --red:      #F06060;
  --red-s:    #2A0F0F;
  --yellow:   #F0B830;
  --yellow-s: #2A1F05;
  --shadow:   0 1px 4px rgba(0,0,0,.3), 0 4px 16px rgba(0,0,0,.2);
  --shadow-lg:0 4px 24px rgba(0,0,0,.4);
}
:root[data-theme="light"] {
  --bg:       #F7F8FA;
  --surface:  #FFFFFF;
  --surface2: #EEF0F4;
  --border:   #E2E5EB;
  --text:     #1A1D23;
  --text-2:   #5C6070;
  --text-3:   #9AA0B0;
  --accent:   #4A72E8;
  --accent-h: #3A5FD4;
  --accent-s: #EBF0FD;
}

/* ─── RESET ─────────────────────────────────────────────── */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-padding-top: env(safe-area-inset-top, 0px); }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  min-height: 100vh;
  overflow-x: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
a { color: var(--accent); text-decoration: none; }
a:hover { color: var(--accent-h); }
button, input, textarea, select { font: inherit; outline: none; border: none; background: none; color: inherit; }
img { max-width: 100%; display: block; }

/* ─── UTILITY ────────────────────────────────────────────── */
.hidden   { display: none !important; }
.flex     { display: flex; }
.flex-col { flex-direction: column; }
.gap-1    { gap: 6px; }
.gap-2    { gap: 12px; }
.items-center { align-items: center; }
.justify-between { justify-content: space-between; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ─── SPINNER ────────────────────────────────────────────── */
.spinner {
  width: 20px; height: 20px;
  border: 2.5px solid var(--border);
  border-top-color: var(--accent);
  border-radius: 50%;
  animation: spin .7s linear infinite;
  display: inline-block;
  flex-shrink: 0;
}
@keyframes spin { to { transform: rotate(360deg); } }
.loading-center { display: flex; align-items: center; justify-content: center; padding: 60px; }

/* ─── TOASTS ─────────────────────────────────────────────── */
#toast-root {
  position: fixed; bottom: 24px; right: 24px;
  z-index: 9999;
  display: flex; flex-direction: column; gap: 8px;
  pointer-events: none;
}
.toast {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 16px;
  font-size: .875rem;
  box-shadow: var(--shadow-lg);
  display: flex; align-items: center; gap: 8px;
  animation: slide-in .25s ease;
  pointer-events: auto;
  max-width: 320px;
}
.toast.err  { border-left: 3px solid var(--red);    background: var(--red-s); }
.toast.ok   { border-left: 3px solid var(--green);  background: var(--green-s); }
.toast.warn { border-left: 3px solid var(--yellow); background: var(--yellow-s); }
@keyframes slide-in { from { opacity: 0; transform: translateX(16px); } to { opacity: 1; transform: none; } }

/* ─── BUTTONS ────────────────────────────────────────────── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 16px;
  border-radius: var(--radius);
  font-size: .875rem; font-weight: 500;
  cursor: pointer;
  transition: background .15s, opacity .15s, box-shadow .15s;
  white-space: nowrap;
  border: 1.5px solid transparent;
}
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn-primary  { background: var(--accent); color: #fff; border-color: var(--accent); }
.btn-primary:hover:not(:disabled) { background: var(--accent-h); border-color: var(--accent-h); }
.btn-ghost    { color: var(--text-2); border-color: var(--border); background: var(--surface); }
.btn-ghost:hover:not(:disabled) { background: var(--surface2); color: var(--text); }
.btn-danger   { background: var(--red-s); color: var(--red); border-color: var(--red); }
.btn-danger:hover:not(:disabled) { opacity: .85; }
.btn-sm       { padding: 5px 10px; font-size: .8rem; }
.btn-icon {
  padding: 7px; border-radius: var(--radius);
  color: var(--text-2); border: 1.5px solid transparent;
  cursor: pointer; transition: background .15s, color .15s;
  display: inline-flex; align-items: center; justify-content: center;
}
.btn-icon:hover { background: var(--surface2); color: var(--text); }
.btn-icon svg { display: block; width: 18px; height: 18px; }

/* ─── FORM INPUTS ────────────────────────────────────────── */
.input {
  width: 100%; padding: 9px 12px;
  border: 1.5px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface); color: var(--text);
  font-size: .9rem;
  transition: border-color .15s, box-shadow .15s;
}
.input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-s); }
.input::placeholder { color: var(--text-3); }
label { font-size: .82rem; font-weight: 500; color: var(--text-2); display: block; margin-bottom: 5px; }
.field { display: flex; flex-direction: column; gap: 4px; }

/* ─── MODAL ──────────────────────────────────────────────── */
.modal-backdrop {
  position: fixed; inset: 0;
  background: rgba(0,0,0,.5);
  z-index: 1000;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
  backdrop-filter: blur(3px);
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 100%; max-width: 440px;
  padding: 28px;
  display: flex; flex-direction: column; gap: 20px;
  animation: modal-in .2s ease;
  max-height: calc(100vh - 32px);
  overflow-y: auto;
}
@keyframes modal-in { from { opacity: 0; transform: scale(.96) translateY(8px); } to { opacity: 1; transform: none; } }
.modal-title { font-size: 1.1rem; font-weight: 600; }

/* ─── AUTH ───────────────────────────────────────────────── */
#auth-screen {
  min-height: 100vh;
  display: flex; align-items: center; justify-content: center;
  padding: 16px;
}
.auth-card {
  background: var(--surface);
  border-radius: var(--radius-lg);
  padding: 36px 32px;
  width: 100%; max-width: 400px;
  box-shadow: var(--shadow-lg);
  display: flex; flex-direction: column; gap: 22px;
}
.auth-logo { display: flex; align-items: center; gap: 10px; }
.auth-logo-mark {
  width: 38px; height: 38px; border-radius: 10px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: 1.1rem;
}
.auth-logo-text { font-size: 1.25rem; font-weight: 600; letter-spacing: -.02em; }
.auth-logo-text span { color: var(--accent); }
.auth-heading { font-size: 1.45rem; font-weight: 600; letter-spacing: -.02em; line-height: 1.3; }
.auth-sub { font-size: .875rem; color: var(--text-2); line-height: 1.5; }
.auth-sep { display: flex; align-items: center; gap: 10px; color: var(--text-3); font-size: .8rem; }
.auth-sep::before, .auth-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-switch { font-size: .85rem; color: var(--text-2); text-align: center; }
.auth-switch a { font-weight: 500; }
/* Spinner inside auth button */
.btn-loading { gap: 8px; }

/* ─── APP SHELL ──────────────────────────────────────────── */
#app { display: flex; min-height: 100vh; }

/* Sidebar */
#sidebar {
  width: var(--sidebar-w);
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex; flex-direction: column;
  position: fixed; top: 0; left: 0; bottom: 0;
  z-index: 200;
  transition: transform .25s ease;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.sidebar-header {
  padding: 14px 16px 12px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; justify-content: space-between;
}
.logo { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: .95rem; }
.logo-mark {
  width: 30px; height: 30px; border-radius: 8px;
  background: var(--accent);
  display: flex; align-items: center; justify-content: center;
  color: #fff; font-weight: 700; font-size: .9rem; flex-shrink: 0;
}
/* Hide close-sidebar on desktop */
#close-sidebar { display: none; }

.sidebar-search { padding: 10px 12px; border-bottom: 1px solid var(--border); position: relative; }
.sidebar-search input {
  width: 100%; padding: 7px 10px 7px 32px;
  border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg); font-size: .82rem; color: var(--text);
}
.sidebar-search input:focus { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-s); outline: none; }
.search-icon {
  position: absolute; left: 22px; top: 50%;
  transform: translateY(-50%);
  color: var(--text-3); pointer-events: none;
}
.sidebar-topics { flex: 1; overflow-y: auto; padding: 8px; }
.sidebar-section-label {
  font-size: .72rem; font-weight: 600; color: var(--text-3);
  letter-spacing: .06em; padding: 8px 8px 4px; text-transform: uppercase;
}
.topic-item {
  display: flex; align-items: center;
  padding: 7px 8px; border-radius: 8px;
  cursor: pointer; gap: 8px;
  transition: background .12s; color: var(--text-2); font-size: .875rem;
}
.topic-item:hover { background: var(--surface2); color: var(--text); }
.topic-item.active { background: var(--accent-s); color: var(--accent); font-weight: 500; }
.topic-item .ti-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topic-item .ti-badge {
  font-size: .68rem; padding: 1px 5px; border-radius: 20px;
  background: var(--surface2); color: var(--text-3); flex-shrink: 0;
}
.topic-item.active .ti-badge { background: var(--accent); color: #fff; }
.topic-item .ti-lock { color: var(--text-3); flex-shrink: 0; }

.sidebar-footer {
  padding: 10px 12px; border-top: 1px solid var(--border);
  display: flex; align-items: center; gap: 8px;
}
.user-avatar {
  width: 30px; height: 30px; border-radius: 50%;
  background: var(--accent-s); color: var(--accent);
  font-weight: 600; font-size: .8rem;
  display: flex; align-items: center; justify-content: center; flex-shrink: 0;
}
.user-email { font-size: .78rem; color: var(--text-2); flex: 1; min-width: 0; }

/* Main */
#main { flex: 1; margin-left: var(--sidebar-w); display: flex; flex-direction: column; min-height: 100vh; }
#header {
  position: sticky; top: 0; z-index: 100;
  height: var(--header-h);
  background: var(--surface); border-bottom: 1px solid var(--border);
  display: flex; align-items: center; padding: 0 20px; gap: 12px;
  margin-top: env(safe-area-inset-top, 0px);
}
#header .page-title {
  font-size: 1rem; font-weight: 600; flex: 1; min-width: 0;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
#content {
  flex: 1; padding: 24px 28px;
  max-width: 920px; width: 100%; margin: 0 auto;
}

/* Sidebar overlay — only used on mobile */
#sidebar-overlay {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.4); z-index: 150;
}
/* hamburger hidden on desktop */
#open-sidebar { display: none; }

/* ─── BADGES ─────────────────────────────────────────────── */
.badge {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: .75rem; font-weight: 500; padding: 3px 8px; border-radius: 20px;
}
.badge-green  { background: var(--green-s);  color: var(--green); }
.badge-yellow { background: var(--yellow-s); color: var(--yellow); }
.badge-blue   { background: var(--accent-s); color: var(--accent); }

/* ─── TOPIC META ─────────────────────────────────────────── */
.topic-meta {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  margin-bottom: 20px;
}

/* ─── QUESTION CARDS ─────────────────────────────────────── */
.q-list { display: flex; flex-direction: column; gap: 14px; }
.q-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-lg); overflow: hidden;
  box-shadow: var(--shadow); transition: box-shadow .15s;
}
.q-card:hover { box-shadow: var(--shadow-lg); }
.q-header {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 16px 18px 14px; cursor: pointer;
  user-select: none; -webkit-tap-highlight-color: transparent;
}
.q-num {
  flex-shrink: 0; margin-top: 2px;
  width: 22px; height: 22px; border-radius: 6px;
  background: var(--accent-s); color: var(--accent);
  font-size: .72rem; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.q-text {
  flex: 1; font-family: var(--serif);
  font-size: 1rem; font-weight: 500; line-height: 1.5; color: var(--text);
}
.q-chevron { flex-shrink: 0; margin-top: 2px; color: var(--text-3); transition: transform .2s; }
.q-card.open .q-chevron { transform: rotate(90deg); }
.q-answer { display: none; padding: 0 18px 18px; border-top: 1px solid var(--border); }
.q-card.open .q-answer { display: block; }
.q-answer-inner { padding-top: 16px; font-size: .9rem; line-height: 1.75; color: var(--text); }
.q-actions { display: flex; gap: 6px; flex-shrink: 0; margin-left: auto; }

/* ─── MARKDOWN ───────────────────────────────────────────── */
.md-body h1,.md-body h2,.md-body h3,.md-body h4 {
  font-family: var(--serif); font-weight: 500;
  margin: 1.2em 0 .5em; line-height: 1.3; color: var(--text);
}
.md-body h1 { font-size: 1.4rem; }
.md-body h2 { font-size: 1.2rem; }
.md-body h3 { font-size: 1rem; }
.md-body p  { margin: 0 0 .8em; }
.md-body ul,.md-body ol { padding-left: 1.5em; margin: 0 0 .8em; }
.md-body li { margin-bottom: .3em; }
.md-body blockquote {
  border-left: 3px solid var(--accent); margin: 0 0 1em;
  padding: 6px 14px; color: var(--text-2);
  background: var(--accent-s); border-radius: 0 6px 6px 0;
}
.md-body table { width: 100%; border-collapse: collapse; margin: 0 0 1em; font-size: .875rem; }
.md-body th,.md-body td { padding: 8px 12px; border: 1px solid var(--border); text-align: left; }
.md-body th { background: var(--surface2); font-weight: 600; }
.md-body tr:nth-child(even) { background: var(--bg); }
.md-body a { color: var(--accent); text-decoration: underline; }
.md-body hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
.md-body img { border-radius: var(--radius); max-width: 100%; }

/* ─── INLINE CODE ────────────────────────────────────────── */
.md-body code {
  font-family: var(--mono);
  font-size: .82em;
  background: var(--surface2);
  border: 1px solid var(--border);
  border-radius: 5px;
  padding: 1px 5px;
}

/* ─── CODE BLOCKS ────────────────────────────────────────── */
.code-block-wrapper {
  position: relative;
  margin: 0 0 1em;
  border-radius: var(--radius);
  overflow: hidden;
  border: 1px solid var(--border);
  background: #1a1d2e;
}
.code-block-header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 6px 14px;
  background: #12141f;
  border-bottom: 1px solid rgba(255,255,255,.08);
}
.code-lang-label {
  font-size: .7rem; font-weight: 600; letter-spacing: .08em;
  text-transform: uppercase; color: #6b8fff; font-family: var(--mono);
}
.copy-btn {
  display: flex; align-items: center; gap: 5px;
  font-size: .72rem; font-weight: 500;
  color: #9aa0b0; background: rgba(255,255,255,.07);
  border: 1px solid rgba(255,255,255,.1);
  border-radius: 6px; padding: 3px 8px;
  cursor: pointer; transition: background .15s, color .15s;
  font-family: var(--font);
}
.copy-btn:hover { background: rgba(255,255,255,.14); color: #e8eaf0; }
.copy-btn svg { width: 12px; height: 12px; }
.code-block-wrapper pre {
  margin: 0; padding: 14px 16px;
  overflow-x: auto; background: transparent;
  border: none;
}
.code-block-wrapper pre code {
  font-family: var(--mono); font-size: .84rem;
  line-height: 1.7; color: #e8eaf0;
  background: none; border: none; padding: 0;
}
/* Syntax highlight token colours (basic) */
.tok-kw   { color: #c792ea; }
.tok-str  { color: #c3e88d; }
.tok-num  { color: #f78c6c; }
.tok-cmt  { color: #546e7a; font-style: italic; }
.tok-fn   { color: #82aaff; }
.tok-op   { color: #89ddff; }

/* ─── MERMAID ────────────────────────────────────────────── */
.mermaid-wrapper {
  margin: 1em 0;
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  background: linear-gradient(135deg, var(--accent-s) 0%, var(--surface) 100%);
  padding: 20px;
  overflow-x: auto;
  box-shadow: var(--shadow);
}
.mermaid-wrapper svg {
  max-width: 100%;
  height: auto;
  display: block;
  margin: 0 auto;
}
.mermaid-wrapper .node rect,
.mermaid-wrapper .node circle,
.mermaid-wrapper .node ellipse,
.mermaid-wrapper .node polygon {
  filter: drop-shadow(0 2px 4px rgba(74,114,232,.2));
}

/* ─── EDITOR ─────────────────────────────────────────────── */
/* Fix 9: Increased editor modal width by 20% → 1080px from 900px */
#editor-modal .modal {
  max-width: 1080px; width: 100%; padding: 0;
}
.editor-header {
  padding: 14px 18px; border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
}
.editor-title-input {
  flex: 1; font-family: var(--serif); font-size: 1rem; font-weight: 500;
  padding: 6px 10px; border: 1.5px solid var(--border); border-radius: 8px;
  background: var(--bg);
}
.editor-title-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-s); outline: none; }
.editor-toolbar {
  padding: 6px 12px; border-bottom: 1px solid var(--border);
  display: flex; gap: 2px; flex-wrap: wrap; background: var(--bg);
}
.tb-btn {
  padding: 4px 8px; border-radius: 6px; cursor: pointer;
  font-size: .78rem; font-weight: 500; color: var(--text-2);
  transition: background .12s, color .12s;
  display: flex; align-items: center; gap: 4px;
}
.tb-btn:hover { background: var(--surface2); color: var(--text); }
.tb-sep { width: 1px; background: var(--border); margin: 2px 4px; align-self: stretch; }
.editor-body {
  display: grid; grid-template-columns: 1fr 1fr;
  height: 480px; overflow: hidden;
}
.editor-pane { display: flex; flex-direction: column; overflow: hidden; }
.editor-pane-label {
  padding: 5px 14px; font-size: .7rem; font-weight: 600;
  color: var(--text-3); letter-spacing: .06em; text-transform: uppercase;
  background: var(--bg); border-bottom: 1px solid var(--border);
}
.editor-pane:last-child { border-left: 1px solid var(--border); }
.editor-textarea {
  flex: 1; padding: 14px;
  font-family: var(--mono); font-size: .83rem; line-height: 1.7;
  resize: none; border: none; background: var(--surface); color: var(--text); overflow-y: auto;
}
.editor-textarea:focus { outline: none; }
.editor-preview { flex: 1; padding: 14px; overflow-y: auto; background: var(--surface); font-size: .875rem; }
.editor-footer {
  padding: 12px 18px; border-top: 1px solid var(--border);
  display: flex; align-items: center; justify-content: flex-end; gap: 10px;
}

/* ─── TOPIC FORM ─────────────────────────────────────────── */
.topic-form { display: flex; flex-direction: column; gap: 16px; }
.toggle-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.toggle-info { flex: 1; }
.toggle-label { font-size: .875rem; font-weight: 500; }
.toggle-desc  { font-size: .8rem; color: var(--text-2); margin-top: 2px; }
.toggle { position: relative; width: 40px; height: 22px; flex-shrink: 0; }
.toggle input { display: none; }
.toggle-track {
  position: absolute; inset: 0; background: var(--border);
  border-radius: 20px; cursor: pointer; transition: background .2s;
}
.toggle input:checked + .toggle-track { background: var(--accent); }
.toggle-thumb {
  position: absolute; left: 3px; top: 3px;
  width: 16px; height: 16px; border-radius: 50%; background: #fff;
  transition: transform .2s; pointer-events: none;
}
.toggle input:checked ~ .toggle-thumb { transform: translateX(18px); }

/* ─── PUBLIC BANNER ──────────────────────────────────────── */
#public-banner {
  background: var(--accent-s); border-bottom: 1px solid var(--border);
  padding: 10px 20px; text-align: center; font-size: .82rem; color: var(--accent);
}

/* ─── SEARCH RESULTS ─────────────────────────────────────── */
.search-result-q { padding: 10px 14px; border-radius: 8px; cursor: pointer; transition: background .12s; }
.search-result-q:hover { background: var(--surface2); }
.search-result-q .srq-topic { font-size: .72rem; color: var(--text-3); margin-bottom: 2px; }
.search-result-q .srq-text  { font-size: .875rem; font-weight: 500; }

/* ─── EMPTY STATE ────────────────────────────────────────── */
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 16px; padding: 60px 24px; text-align: center;
}
.empty-state svg { color: var(--text-3); }
.empty-state h2 { font-size: 1.25rem; font-weight: 600; }
.empty-state p  { font-size: .9rem; color: var(--text-2); max-width: 320px; line-height: 1.6; }

/* ─── PUBLIC MODE ────────────────────────────────────────── */
body.public-mode #main    { margin-left: 0; }
body.public-mode #sidebar { display: none; }

/* ─── RESPONSIVE ─────────────────────────────────────────── */
@media (max-width: 900px) {
  #editor-modal .modal { max-width: 98vw; }
}
@media (max-width: 768px) {
  #open-sidebar  { display: inline-flex; }
  #close-sidebar { display: inline-flex; }
  #sidebar { transform: translateX(-100%); }
  #sidebar.open { transform: none; box-shadow: var(--shadow-lg); }
  #sidebar-overlay.open { display: block; }
  #main { margin-left: 0; }
  #content { padding: 16px; }
  .editor-body { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; height: 520px; }
  .editor-pane:last-child { border-left: none; border-top: 1px solid var(--border); }
  #header { padding: 0 14px; }
  .q-text { font-size: .925rem; }
  .auth-card { padding: 28px 20px; }
}
@media (max-width: 480px) {
  .editor-body { height: 460px; }
  .modal { padding: 20px; }
  #content { padding: 12px; }
}
</style>
</head>

<script>
// ─────────────────────────────────────────────────────────────────
// CONFIG  – injected by GitHub Actions from secrets
// ─────────────────────────────────────────────────────────────────
const SUPABASE_URL  = window.ENV_SUPABASE_URL  || 'YOUR_SUPABASE_URL';
const SUPABASE_ANON = window.ENV_SUPABASE_ANON || 'YOUR_SUPABASE_ANON_KEY';

// ─────────────────────────────────────────────────────────────────
// CLIENTS
// ─────────────────────────────────────────────────────────────────
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON);

mermaid.initialize({
  startOnLoad: false,
  theme: 'base',
  securityLevel: 'loose',
  themeVariables: {
    primaryColor:       '#4A72E8',
    primaryTextColor:   '#ffffff',
    primaryBorderColor: '#3A5FD4',
    lineColor:          '#6B8FFF',
    secondaryColor:     '#EBF0FD',
    tertiaryColor:      '#f0f4ff',
    background:         'transparent',
    fontSize:           '14px',
    fontFamily:         'Inter, system-ui, sans-serif',
  }
});

marked.setOptions({ breaks: true, gfm: true });

// ─────────────────────────────────────────────────────────────────
// STATE
// ─────────────────────────────────────────────────────────────────
const state = {
  user: null,
  topics: [],
  currentTopicId: null,
  questions: [],
  editingQId: null,
  editingTopicId: null,
  publicMode: false,
  theme: localStorage.getItem('pv-theme') || 'auto',
};

// ─────────────────────────────────────────────────────────────────
// THEME
// ─────────────────────────────────────────────────────────────────
function applyTheme() {
  const t = state.theme;
  const el = document.documentElement;
  if (t === 'dark')  el.setAttribute('data-theme', 'dark');
  else if (t === 'light') el.setAttribute('data-theme', 'light');
  else el.removeAttribute('data-theme');
}
function toggleTheme() {
  const themes = ['auto', 'dark', 'light'];
  state.theme = themes[(themes.indexOf(state.theme) + 1) % 3];
  localStorage.setItem('pv-theme', state.theme);
  applyTheme();
}
applyTheme();

// ─────────────────────────────────────────────────────────────────
// UTILS
// ─────────────────────────────────────────────────────────────────
function esc(s)     { return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function escAttr(s) { return String(s).replace(/"/g,'&quot;').replace(/'/g,'&#39;'); }

function toast(msg, type = 'ok', dur = 3200) {
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById('toast-root').appendChild(el);
  setTimeout(() => el.remove(), dur);
}

function showConfirm(title, body) {
  return new Promise(resolve => {
    const m = document.getElementById('confirm-modal');
    document.getElementById('confirm-title').textContent = title;
    document.getElementById('confirm-body').textContent  = body;
    m.classList.remove('hidden');
    const cleanup = (v) => { m.classList.add('hidden'); resolve(v); };
    document.getElementById('confirm-yes').onclick = () => cleanup(true);
    document.getElementById('confirm-no').onclick  = () => cleanup(false);
  });
}

// ─────────────────────────────────────────────────────────────────
// URL HELPERS — simple UUID in ?topic=
// ─────────────────────────────────────────────────────────────────
function getPublicParam() {
  return new URLSearchParams(location.search).get('topic') || null;
}

function setCleanUrl(topic) {
  const base = location.pathname;
  const next = topic ? `${base}?topic=${topic.id}` : base;
  history.replaceState(null, '', next);
}

// ─────────────────────────────────────────────────────────────────
// MARKDOWN + MERMAID RENDERER
// ─────────────────────────────────────────────────────────────────
async function renderMdWithMermaid(el, md) {
  el.innerHTML = '';
  const raw = md || '';
  // Split on mermaid fences first
  const parts = raw.split(/(```mermaid[\s\S]*?```)/g);

  for (const part of parts) {
    const mmatch = part.match(/^```mermaid\n?([\s\S]*?)```$/);
    if (mmatch) {
      const code    = mmatch[1].trim();
      const id      = 'mm' + Math.random().toString(36).slice(2);
      const wrapper = document.createElement('div');
      wrapper.className = 'mermaid-wrapper';
      try {
        const { svg } = await mermaid.render(id, code);
        wrapper.innerHTML = svg;
      } catch(e) {
        wrapper.innerHTML = `<pre style="color:var(--red);font-size:.8rem;padding:8px">Diagram error: ${esc(e.message)}</pre>`;
      }
      el.appendChild(wrapper);
    } else if (part.trim()) {
      const div = document.createElement('div');
      div.innerHTML = DOMPurify.sanitize(marked.parse(part));
      // Enhance code blocks
      div.querySelectorAll('pre').forEach(enhanceCodeBlock);
      el.appendChild(div);
    }
  }
}

// ─────────────────────────────────────────────────────────────────
// FIX 7: Enhanced code blocks — copy button + language label
// ─────────────────────────────────────────────────────────────────
function enhanceCodeBlock(pre) {
  const code = pre.querySelector('code');
  if (!code) return;

  // Detect language from class e.g. language-javascript
  const langClass = Array.from(code.classList).find(c => c.startsWith('language-'));
  const lang = langClass ? langClass.replace('language-', '') : 'code';

  const wrapper = document.createElement('div');
  wrapper.className = 'code-block-wrapper';

  const header = document.createElement('div');
  header.className = 'code-block-header';
  header.innerHTML = `
    <span class="code-lang-label">${esc(lang)}</span>
    <button class="copy-btn" title="Copy code">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
      </svg>
      Copy
    </button>`;

  header.querySelector('.copy-btn').addEventListener('click', () => {
    navigator.clipboard.writeText(code.textContent).then(() => {
      const btn = header.querySelector('.copy-btn');
      btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Copied!`;
      btn.style.color = '#34c987';
      setTimeout(() => {
        btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy`;
        btn.style.color = '';
      }, 2000);
    });
  });

  // Set Cascadia Code font on the code element
  code.style.fontFamily = "'Cascadia Code', 'Fira Code', 'SF Mono', Consolas, monospace";

  pre.parentNode.insertBefore(wrapper, pre);
  wrapper.appendChild(header);
  wrapper.appendChild(pre);
}

// ─────────────────────────────────────────────────────────────────
// BOOT / ROUTER
// ─────────────────────────────────────────────────────────────────
async function boot() {
  const param = getPublicParam();
  if (param) { await bootPublic(param); return; }

  const { data: { session } } = await sb.auth.getSession();
  if (!session) { showAuthScreen('login'); return; }
  state.user = session.user;
  await showApp();
}

// ─────────────────────────────────────────────────────────────────
// PUBLIC MODE
// ─────────────────────────────────────────────────────────────────
async function bootPublic(topicId) {
  state.publicMode = true;
  document.body.classList.add('public-mode');
  document.getElementById('auth-screen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('open-sidebar').classList.add('hidden');

  const banner = document.createElement('div');
  banner.id = 'public-banner';
  banner.innerHTML = `📖 Viewing a shared topic. <a href="${location.origin}${location.pathname}" style="font-weight:600">Create your own PrepVault →</a>`;
  document.getElementById('main').prepend(banner);

  const { data: topic, error } = await sb.from('topics')
    .select('*').eq('id', topicId).eq('is_public', true).single();

  if (error || !topic) {
    document.getElementById('content').innerHTML = `<div class="empty-state">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <h2>Topic not found</h2><p>This topic is private or does not exist.</p></div>`;
    return;
  }

  document.getElementById('header-title').textContent = topic.name;
  const { data: questions } = await sb.from('questions')
    .select('*').eq('topic_id', topic.id).order('sort_order').order('created_at');
  renderQuestions(questions || [], topic, true);
}

// ─────────────────────────────────────────────────────────────────
// AUTH
// ─────────────────────────────────────────────────────────────────
let authMode = 'login';

function showAuthScreen(mode = 'login') {
  authMode = mode;
  document.getElementById('auth-screen').classList.remove('hidden');
  document.getElementById('app').classList.add('hidden');
  // Fix 3: strip ?topic= from URL when not logged in
  history.replaceState(null, '', location.pathname);
  updateAuthUI();
}

function updateAuthUI() {
  const isLogin = authMode === 'login';
  document.getElementById('auth-heading').textContent = isLogin ? 'Welcome back' : 'Create account';
  document.getElementById('auth-sub').textContent     = isLogin
    ? 'Sign in to access your interview questions.'
    : 'Start organizing your interview prep today.';
  const btn = document.getElementById('auth-submit');
  btn.disabled = false;
  btn.innerHTML = isLogin ? 'Sign in' : 'Create account';
  document.getElementById('name-field').style.display    = isLogin ? 'none' : '';
  document.getElementById('confirm-field').style.display = isLogin ? 'none' : '';
  document.getElementById('auth-switch').innerHTML = isLogin

    : `Already have an account? <a href="#" id="auth-toggle">Sign in instead</a>`;

    e.preventDefault();
    authMode = isLogin ? 'signup' : 'login';
    updateAuthUI();
  };
}

// Fix 2: proper spinner in auth button
function setAuthLoading(on) {
  const btn = document.getElementById('auth-submit');
  if (on) {
    btn.disabled = true;
    btn.innerHTML = `<span class="spinner" style="width:16px;height:16px;border-width:2px"></span> ${authMode === 'login' ? 'Signing in…' : 'Creating…'}`;
  } else {
    updateAuthUI();
  }
}

document.getElementById('auth-submit').onclick = async () => {
  const email = document.getElementById('auth-email').value.trim();
  const pwd   = document.getElementById('auth-password').value;
  const name  = document.getElementById('auth-name').value.trim();
  const conf  = document.getElementById('auth-confirm').value;

  if (!email || !pwd) { toast('Email and password required', 'err'); return; }
  if (pwd.length < 6)  { toast('Password must be at least 6 characters', 'err'); return; }

  setAuthLoading(true);

  if (authMode === 'signup') {
    if (pwd !== conf) { toast('Passwords do not match', 'err'); setAuthLoading(false); return; }
    const { data: su, error: se } = await sb.auth.signUp({
      email, password: pwd, options: { data: { full_name: name } }
    });
    if (se) {
      if (se.message.toLowerCase().includes('already')) {
        toast('Account exists. Signing you in…', 'warn');
        const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
        if (error) { toast(error.message, 'err'); setAuthLoading(false); return; }
        state.user = data.user; await showApp(); return;
      }
      toast(se.message, 'err'); setAuthLoading(false); return;
    }
    if (su?.session) { state.user = su.session.user; await showApp(); return; }
    toast('Account created! Check your email, then sign in.', 'ok', 8000);
    authMode = 'login'; setAuthLoading(false); updateAuthUI(); return;
  }

  const { data, error } = await sb.auth.signInWithPassword({ email, password: pwd });
  if (error) {
    const m = error.message.toLowerCase();
    if (m.includes('invalid login') || m.includes('invalid credentials')) toast('Wrong email or password.', 'err');
    else if (m.includes('email not confirmed')) toast('Please confirm your email first.', 'warn', 6000);
    else if (m.includes('rate limit') || m.includes('too many'))  toast('Too many attempts. Wait a few minutes.', 'warn', 6000);
    else toast(error.message, 'err');
    setAuthLoading(false); return;
  }
  state.user = data.user;
  await showApp();
};

async function loadTopics() {
  const { data, error } = await sb.from('topics')
    .select('*, questions(count)').eq('user_id', state.user.id).order('created_at');
  if (error) { toast('Failed to load topics', 'err'); return; }
  state.topics = data || [];
  renderTopicsList();
}

function renderTopicsList(filter = '') {
  const el   = document.getElementById('topics-list');
  const list = filter
    ? state.topics.filter(t => t.name.toLowerCase().includes(filter.toLowerCase()))
    : state.topics;

  if (!list.length) {
    el.innerHTML = `<div style="padding:12px 8px;font-size:.82rem;color:var(--text-3)">${filter ? 'No topics match.' : 'No topics yet.'}</div>`;
    return;
  }
  el.innerHTML = list.map(t => {
    const count  = t.questions?.[0]?.count ?? 0;
    const active = t.id === state.currentTopicId;
    return `<div class="topic-item${active ? ' active' : ''}" data-id="${t.id}">
      <span class="ti-name">${esc(t.name)}</span>
      ${t.is_public ? `<svg class="ti-lock" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>` : ''}
      <span class="ti-badge">${count}</span>
    </div>`;
  }).join('');

  el.querySelectorAll('.topic-item').forEach(item => {
    item.addEventListener('click', () => { closeSidebar(); loadTopic(item.dataset.id); });
  });
}

async function loadTopic(id) {
  state.currentTopicId = id;
  renderTopicsList();
  const topicForUrl = state.topics.find(t => t.id === id);
  if (topicForUrl) setCleanUrl(topicForUrl);

  const topic = state.topics.find(t => t.id === id);
  if (!topic) return;
  document.getElementById('header-title').textContent = topic.name;

  const ha = document.getElementById('header-actions');
  ha.innerHTML = '';
  const addBtn = document.createElement('button');
  addBtn.className = 'btn btn-primary btn-sm';
  addBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Add Question`;
  addBtn.onclick = () => openEditor(null, id);
  ha.appendChild(addBtn);

  const optBtn = document.createElement('button');
  optBtn.className = 'btn btn-ghost btn-sm';
  optBtn.title = 'Topic options';
  optBtn.innerHTML = `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="1"/><circle cx="19" cy="12" r="1"/><circle cx="5" cy="12" r="1"/></svg>`;
  optBtn.onclick = () => openTopicModal(topic);
  ha.appendChild(optBtn);

  document.getElementById('content').innerHTML = `<div class="loading-center"><div class="spinner"></div></div>`;
  const { data, error } = await sb.from('questions')
    .select('*').eq('topic_id', id).order('sort_order').order('created_at');
  if (error) { toast('Failed to load questions', 'err'); return; }
  state.questions = data || [];
  renderQuestions(state.questions, topic);
}

// RENDER QUESTIONS
// ─────────────────────────────────────────────────────────────────
function renderQuestions(questions, topic, readOnly = false) {
  const content = document.getElementById('content');
  const pubBadge = topic.is_public
    ? `<span class="badge badge-green"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg> Public</span>`
    : `<span class="badge badge-yellow"><svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Private</span>`;
  const shareBtn = (!readOnly && topic.is_public)
    ? `<button class="btn btn-ghost btn-sm" id="share-btn-top"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg> Share</button>` : '';

  if (!questions.length) {
    content.innerHTML = `
      <div class="topic-meta">${pubBadge}${shareBtn}</div>
      <div class="empty-state">
        <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
        <h2>No questions yet</h2>
        <p>${readOnly ? 'This topic has no questions.' : 'Click "Add Question" to get started.'}</p>
        ${readOnly ? '' : `<button class="btn btn-primary" onclick="openEditor(null,'${topic.id}')"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg> Add first question</button>`}
      </div>`;
    if (!readOnly && topic.is_public) document.getElementById('share-btn-top')?.addEventListener('click', () => showShareModal(topic));
    return;
  }

  content.innerHTML = `
    <div class="topic-meta">
      ${pubBadge}
      <span class="badge badge-blue">${questions.length} question${questions.length !== 1 ? 's' : ''}</span>
      ${topic.description ? `<span style="font-size:.82rem;color:var(--text-3)">${esc(topic.description)}</span>` : ''}
      <div style="flex:1"></div>
      ${shareBtn}
    </div>
    <div class="q-list" id="q-list">${questions.map((q,i) => renderQCard(q, i+1, readOnly)).join('')}</div>`;

  content.querySelectorAll('.q-card').forEach(card => {
    card.querySelector('.q-header').addEventListener('click', async (e) => {
      if (e.target.closest('.q-actions')) return;
      card.classList.toggle('open');
      if (card.classList.contains('open')) {
        const inner = card.querySelector('.q-answer-inner');
        if (inner && !inner.dataset.rendered) {
          inner.dataset.rendered = '1';
          await renderMdWithMermaid(inner, inner.dataset.md);
        }
      }
    });
  });

  if (!readOnly) {
    content.querySelectorAll('.q-edit').forEach(b   => b.addEventListener('click', () => openEditor(b.dataset.id, topic.id)));
    content.querySelectorAll('.q-delete').forEach(b  => b.addEventListener('click', () => deleteQuestion(b.dataset.id)));
    if (topic.is_public) document.getElementById('share-btn-top')?.addEventListener('click', () => showShareModal(topic));
  }
}

function renderQCard(q, num, readOnly) {
  const actions = readOnly ? '' : `
    <div class="q-actions">
      <button class="btn-icon q-edit" data-id="${q.id}" title="Edit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
      </button>
      <button class="btn-icon q-delete" data-id="${q.id}" title="Delete">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6"/><path d="M9 6V4h6v2"/></svg>
      </button>
    </div>`;
  return `<div class="q-card" data-id="${q.id}">
    <div class="q-header">
      <div class="q-num">${num}</div>
      <div class="q-text">${esc(q.question)}</div>
      ${actions}
      <svg class="q-chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
    </div>
    <div class="q-answer">
      <div class="q-answer-inner md-body" data-md="${escAttr(q.answer || '')}">
        <div class="spinner" style="width:18px;height:18px"></div>
      </div>
    </div>
  </div>`;
}

function insertMarkdown(ta, action) {
  const sel = ta.value.substring(ta.selectionStart, ta.selectionEnd);
  const s = ta.selectionStart, e = ta.selectionEnd;
  const map = {
    bold:      ['**','**','bold text'],
    italic:    ['_','_','italic text'],
    code:      ['`','`','code'],
    h2:        ['## ','','Heading'],
    h3:        ['### ','','Heading'],
    ul:        ['- ','','item'],
    ol:        ['1. ','','item'],
    link:      ['[','](url)','link text'],
    table:     ['| Column 1 | Column 2 |\n|----------|----------|\n| Cell 1   | Cell 2   |','',''],
    codeblock: ['```javascript\n','\n```','// your code here'],
    mermaid:   ['```mermaid\ngraph TD\n  A[Start] --> B{Decision}\n  B -- Yes --> C[Do it]\n  B -- No  --> D[Skip]\n```','',''],
  };
  const [before, after, ph] = map[action] || ['','',''];
  ta.setRangeText(before + (sel || ph) + after, s, e, 'select');
  ta.focus();
}

function openTopicModal(topic = null) {

  document.getElementById('topic-name').value   = topic?.name        || '';

document.getElementById('topic-form').onsubmit = async () => {

  const desc     = document.getElementById('topic-desc').value.trim();
  const isPublic = document.getElementById('topic-public').checked;
  if (!name) { toast('Name required', 'err'); return; }

  const btn = document.getElementById('topic-save');
  btn.disabled = true;
  btn.innerHTML = `<span class="spinner" style="width:13px;height:13px;border-width:2px"></span>`;

  const payload = { name, description: desc, is_public: isPublic };

  if (state.editingTopicId) {
    const { error } = await sb.from('topics').update(payload).eq('id', state.editingTopicId);
    if (error) { toast(error.message, 'err'); btn.disabled=false; btn.textContent='Save Changes'; return; }
    toast('Topic updated');
  } else {
    const { error } = await sb.from('topics').insert({ ...payload, user_id: state.user.id });
    if (error) { toast(error.message, 'err'); btn.disabled=false; btn.textContent='Create Topic'; return; }
    toast('Topic created');

  document.getElementById('topic-modal').classList.add('hidden');
  const prevId = state.editingTopicId;
  await loadTopics();
  if (prevId) await loadTopic(prevId);

// Fix 1: deleteTopic — delete questions first then topic, both with user_id guard
async function deleteTopic(id) {
  const ok = await showConfirm('Delete topic?', 'All questions in this topic will be deleted. This cannot be undone.');
  if (!ok) return;

  document.getElementById('topic-modal').classList.add('hidden');

  const { error: qErr } = await sb.from('questions')
    .delete().eq('topic_id', id).eq('user_id', state.user.id);
  if (qErr) { toast('Failed to delete questions: ' + qErr.message, 'err'); return; }

  const { error: tErr } = await sb.from('topics')
    .delete().eq('id', id).eq('user_id', state.user.id);
  if (tErr) { toast('Failed to delete topic: ' + tErr.message, 'err'); return; }

  state.currentTopicId = null;
  // Fix 3: clean URL after topic deleted
  setCleanUrl(null);
  toast('Topic deleted');
  await loadTopics();
  showWelcome();
}

  if (!q) { renderTopicsList(); return; }
  searchTimer = setTimeout(() => doSearch(q), 300);

async function doSearch(q) {
  const { data } = await sb.from('questions')
    .select('id, question, topic_id, topics(name)')
    .eq('user_id', state.user.id)
    .ilike('question', `%${q}%`)
    .limit(30);

  const el = document.getElementById('topics-list');
  if (!data?.length) {
    el.innerHTML = `<div style="padding:12px 8px;font-size:.82rem;color:var(--text-3)">No results for "${esc(q)}"</div>`;
    return;
  }
  el.innerHTML = data.map(r => `
    <div class="search-result-q" data-qid="${r.id}" data-tid="${r.topic_id}">
      <div class="srq-topic">${esc(r.topics?.name || '')}</div>
      <div class="srq-text">${esc(r.question)}</div>
    </div>`).join('');

  el.querySelectorAll('.search-result-q').forEach(item => {
    item.addEventListener('click', async () => {
      const qid = item.dataset.qid;
      const tid = item.dataset.tid;
      document.getElementById('search-input').value = '';
      renderTopicsList();
      closeSidebar();
      await loadTopic(tid);
      // After topic loads, find the card, open it, render its answer, then scroll
      const card = document.querySelector(`.q-card[data-id="${qid}"]`);
      if (card) {
        card.classList.add('open');
        const inner = card.querySelector('.q-answer-inner');
        if (inner && !inner.dataset.rendered) {
          inner.dataset.rendered = '1';
          await renderMdWithMermaid(inner, inner.dataset.md);
        }
        setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
      }
    });
  });
}

document.getElementById('signout-btn').onclick = async () => {
  await sb.auth.signOut();
  state.user = null; state.topics = []; state.currentTopicId = null;
  // Fix 4: clear all auth fields so previous credentials don't persist
  document.getElementById('auth-email').value    = '';
  document.getElementById('auth-password').value = '';
  document.getElementById('auth-name').value     = '';
  document.getElementById('auth-confirm').value  = '';
  showAuthScreen('login');
};
document.getElementById('theme-toggle').onclick = toggleTheme;

// ─────────────────────────────────────────────────────────────────
// AUTH STATE LISTENER
// ─────────────────────────────────────────────────────────────────
sb.auth.onAuthStateChange((event, session) => {
  if (event === 'SIGNED_IN' && session && !state.user) {
    state.user = session.user; showApp();
  }
  if (event === 'SIGNED_OUT') {
    state.user = null;
    document.getElementById('auth-email').value    = '';
    document.getElementById('auth-password').value = '';
    document.getElementById('auth-name').value     = '';
    document.getElementById('auth-confirm').value  = '';
    showAuthScreen('login');
  }
});

// ─────────────────────────────────────────────────────────────────
// GO
// ─────────────────────────────────────────────────────────────────
boot();
</script>
</body>
